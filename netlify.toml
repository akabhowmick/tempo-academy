[build]
  command = "npm run build"
  publish = "dist"

# Not-found fallback. Every real route is a prerendered file in dist/
# (scripts/prerender.mjs writes one per entry in src/lib/route-meta.json,
# including noindex pages like /thanks), and Netlify serves real files before
# applying redirects. So this rule only ever matches unknown paths: it serves
# the app shell with a true 404 status, and the app renders its NotFound page
# (src/pages/NotFound.tsx, noindex). If you add a route, add it to
# route-meta.json too, or it will 404 in production.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    # Content-Security-Policy, one directive per source so this stays legible:
    # - script-src: 'self' plus the one static inline script (the homepage's
    #   JSON-LD, see index.html) pinned by hash instead of 'unsafe-inline'.
    #   If that script's contents ever change, regenerate the hash (see
    #   README "Content Security Policy") and update it here.
    # - style-src needs 'unsafe-inline': a few pages use React style={{...}}
    #   attributes (Courses, Pricing, Contact), and inline style attributes
    #   require it regardless of how they're generated.
    # - frame-src allows the Google Maps embed on /contact.
    # - form-action allows the FormSubmit contact form target
    #   (https://formsubmit.co). After a submission FormSubmit redirects back
    #   to /thanks on this site, which 'self' covers.
    # - connect-src/script-src allow Plausible (plausible.io). Swapping to
    #   Fathom instead? Replace both plausible.io entries with
    #   cdn.usefathom.com.
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; frame-src https://www.google.com; form-action 'self' https://formsubmit.co; script-src 'self' 'sha256-4FeQkV1UqU98AzjwbRzokzie5UhDN/fS5SFfatiUzAY=' https://plausible.io; connect-src 'self' https://plausible.io; upgrade-insecure-requests"
